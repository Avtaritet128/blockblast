<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>Block Blast</title>
    <style>
        * {
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
            animation: fadeOut 0.5s ease forwards;
            animation-delay: 0.8s;
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }
        .loader-icon {
            font-size: 64px;
            animation: bounce 0.6s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
        
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .menu-card {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 35px 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,200,100,0.3);
            max-width: 340px;
            width: 85%;
        }
        .game-title {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff8c42, #ffd93d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .best-score {
            background: rgba(0,0,0,0.5);
            border-radius: 50px;
            padding: 10px 16px;
            margin: 18px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .best-score-item {
            text-align: center;
            flex: 1;
        }
        .best-score-label {
            font-size: 10px;
            color: #aaa;
        }
        .best-score-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffd93d;
        }
        .play-btn {
            background: linear-gradient(145deg, #4CAF50, #2d6a2d);
            border: none;
            font-size: 28px;
            font-weight: bold;
            padding: 14px 35px;
            border-radius: 50px;
            color: white;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1a4a1a;
            transition: 0.05s linear;
            width: 100%;
        }
        .play-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1a4a1a;
        }
        
        .game-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 45px;
            padding: 14px 10px 18px;
        }
        .game-container {
            background: #1a1a2e;
            border-radius: 38px;
            padding: 12px;
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.08), 0 10px 25px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #0f0f1a;
            border-radius: 22px;
            box-shadow: inset 0 0 0 2px #2a2a4a, 0 10px 20px rgba(0,0,0,0.3);
            cursor: grab;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            margin: 0 8px 10px 8px;
            padding: 5px 12px;
            border-radius: 45px;
        }
        .stats-left {
            display: flex;
            gap: 14px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-label {
            font-size: 9px;
            color: #aaa;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffd93d;
        }
        .coin-header {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.5);
            padding: 3px 10px;
            border-radius: 35px;
            font-size: 16px;
            color: #ffd93d;
        }
        .settings-btn {
            background: #2c3e50;
            border: none;
            font-size: 20px;
            padding: 5px 12px;
            border-radius: 35px;
            color: white;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a2a3a;
            transition: 0.05s linear;
        }
        .settings-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a2a3a;
        }
        
        .pieces-panel {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 14px 6px 8px;
            flex-wrap: wrap;
        }
        .piece-card {
            background: transparent;
            border: none;
            padding: 0;
            cursor: grab;
            touch-action: none;
            transition: transform 0.1s ease;
        }
        .piece-card:active {
            transform: scale(1.05);
            cursor: grabbing;
        }
        .piece-canvas {
            background: transparent;
            border-radius: 0;
            display: block;
            width: 75px;
            height: 75px;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        
        .drag-preview {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
            transform: translate(-50%, -50%);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20001;
        }
        .modal-card {
            background: linear-gradient(145deg, #2a3f4f, #1a2a38);
            border-radius: 48px;
            padding: 25px 22px;
            text-align: center;
            max-width: 290px;
            width: 85%;
            border: 1px solid rgba(255,200,100,0.5);
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff8c42;
            margin-bottom: 18px;
        }
        .modal-btn {
            background: #4CAF50;
            border: none;
            padding: 12px 16px;
            border-radius: 35px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            box-shadow: 0 3px 0 #2d6a2d;
            transition: 0.05s linear;
        }
        .modal-btn:active { transform: translateY(2px); }
        .modal-btn-danger { background: #ff9800; box-shadow: 0 3px 0 #c66900; }
        .modal-close { background: #2c485e; box-shadow: 0 3px 0 #0f1920; margin-top: 16px; }
        
        .volume-slider {
            width: 100%;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .volume-slider span { font-size: 18px; }
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #ffd93d;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ffd93d;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px #ffaa00;
        }
        
        @media (max-width: 550px) {
            .piece-canvas { width: 65px; height: 65px; }
            .stats-left { gap: 10px; }
            .stat-value { font-size: 14px; }
            .coin-header { font-size: 14px; }
            .settings-btn { font-size: 18px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loader-icon">🧩</div>
</div>

<div id="mainMenu" class="main-menu" style="display: none;">
    <div class="menu-card">
        <div class="game-title">🧩 BLOCK BLAST</div>
        <div class="best-score">
            <div class="best-score-item">
                <div class="best-score-label">🏆 РЕКОРД</div>
                <div class="best-score-value" id="menuBestScore">0</div>
            </div>
            <div class="best-score-item">
                <div class="best-score-label">🪙 МОНЕТЫ</div>
                <div class="best-score-value" id="menuCoins">0</div>
            </div>
        </div>
        <button class="play-btn" id="playBtn">🎮 ИГРАТЬ</button>
    </div>
</div>

<div id="gameInterface" style="display: none;">
    <div class="game-wrapper">
        <div class="game-container">
            <div class="top-bar">
                <div class="stats-left">
                    <div class="stat-item">
                        <div class="stat-label">🏆 РЕКОРД</div>
                        <div class="stat-value" id="gameBestScore">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">🎯 СЧЁТ</div>
                        <div class="stat-value" id="scoreValue">0</div>
                    </div>
                </div>
                <div class="coin-header">
                    🪙 <span id="gameCoins">0</span>
                </div>
                <button class="settings-btn" id="settingsBtn">⚙️</button>
            </div>
            
            <canvas id="gridCanvas" width="450" height="450" style="aspect-ratio:1/1; max-width: 500px;"></canvas>
            
            <div class="pieces-panel" id="piecesPanel"></div>
        </div>
    </div>
</div>

<script>
    // УПРОЩЁННАЯ ВЕРСИЯ ДЛЯ ТЕЛЕФОНА
    (function(){
        // Простая проверка на ошибки
        try {
            // ==================== НАСТРОЙКИ ====================
            let soundEnabled = true;
            let soundVolume = 0.25;
            
            // ==================== ФИГУРЫ ====================
            const FIGURES_DATA = {
                'single': [[0,0]],
                'line2_h': [[0,0],[0,1]],
                'line2_v': [[0,0],[1,0]],
                'line3_h': [[0,0],[0,1],[0,2]],
                'line3_v': [[0,0],[1,0],[2,0]],
                'line4_h': [[0,0],[0,1],[0,2],[0,3]],
                'line4_v': [[0,0],[1,0],[2,0],[3,0]],
                'square2x2': [[0,0],[0,1],[1,0],[1,1]],
                'square3x3': [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]],
                'L_shape': [[0,0],[1,0],[2,0],[2,1]],
                'T_shape': [[0,0],[0,1],[0,2],[1,1]],
                'Z_shape': [[0,0],[0,1],[1,1],[1,2]],
                'Z_mirror': [[0,1],[0,2],[1,0],[1,1]],
                'corner_small': [[0,0],[0,1],[1,0]]
            };
            
            const COLORS = ["#FF5757", "#57A5FF", "#57FF57", "#FFCE57", "#FF57FF", "#57FFFF", "#FFA557", "#A557FF"];
            const WEIGHTS = {
                'single': 3, 'line2_h': 2, 'line2_v': 2, 'line3_h': 2, 'line3_v': 2,
                'line4_h': 1, 'line4_v': 1, 'square2x2': 2, 'square3x3': 1,
                'L_shape': 2, 'T_shape': 2, 'Z_shape': 2, 'Z_mirror': 2, 'corner_small': 2
            };
            
            function getRandomFigure() {
                let weighted = [];
                for (let [name, weight] of Object.entries(WEIGHTS)) {
                    for (let i = 0; i < weight; i++) weighted.push(name);
                }
                const name = weighted[Math.floor(Math.random() * weighted.length)];
                const blocks = FIGURES_DATA[name].map(([r,c]) => ({ row: r, col: c }));
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                return { blocks, color, name };
            }
            
            function getBoundingBox(blocks) {
                let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
                blocks.forEach(b => {
                    minR = Math.min(minR, b.row); maxR = Math.max(maxR, b.row);
                    minC = Math.min(minC, b.col); maxC = Math.max(maxC, b.col);
                });
                return { rows: maxR-minR+1, cols: maxC-minC+1, minR, maxR, minC, maxC };
            }
            
            class FigureBag {
                constructor() {
                    this.bag = [];
                    this.refill();
                }
                refill() {
                    this.bag = [];
                    for (let [name, weight] of Object.entries(WEIGHTS)) {
                        const blocks = FIGURES_DATA[name].map(([r,c]) => ({ row: r, col: c }));
                        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                        for (let i = 0; i < weight; i++) {
                            this.bag.push({ blocks: blocks.map(b => ({ ...b })), color, name });
                        }
                    }
                    for (let i = this.bag.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
                    }
                }
                get() {
                    if (this.bag.length === 0) this.refill();
                    const fig = this.bag.shift();
                    return { blocks: fig.blocks.map(b => ({ ...b })), color: fig.color, name: fig.name, id: Math.random() };
                }
                get3() { return [this.get(), this.get(), this.get()]; }
            }
            
            // ==================== ИГРОВОЕ ПОЛЕ ====================
            const SIZE = 9;
            let grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            let score = 0, best = 0, coins = 0;
            let shapes = [], selectedIdx = -1, bag = null;
            let dragActive = false, dragFigure = null, dragPreview = null;
            let dragOffsetX = 0, dragOffsetY = 0;
            let hoverR = -1, hoverC = -1;
            let canvas, ctx, scoreSpan, piecesDiv, bestGameSpan, coinsGameSpan, bestMenuSpan, coinsMenuSpan, gameUI, menuUI, loadingUI;
            
            function saveGame() {
                try {
                    if(!bag) return;
                    let saved = {
                        grid: grid.map(r=>[...r]), score, shapes: shapes.map(s=>({ blocks: s.blocks.map(b=>({row:b.row,col:b.col})), color: s.color, name: s.name, id: s.id })),
                        selectedIdx, bagState: { bag: bag.bag.map(b=>({ blocks: b.blocks.map(bb=>({row:bb.row,col:bb.col})), color: b.color, name: b.name })) }
                    };
                    localStorage.setItem('blockblast_save', JSON.stringify(saved));
                } catch(e) { console.log('Save error:', e); }
            }
            
            function loadGame() {
                try {
                    const data = localStorage.getItem('blockblast_save');
                    if(data) {
                        const s = JSON.parse(data);
                        grid = s.grid; score = s.score;
                        shapes = s.shapes;
                        selectedIdx = s.selectedIdx;
                        if(s.bagState) bag.bag = s.bagState.bag;
                        updateScore(); drawBoard(); drawPieces(); return true;
                    }
                } catch(e) { console.log('Load error:', e); }
                return false;
            }
            
            function loadBest() { 
                try { best = parseInt(localStorage.getItem('bb_best')) || 0; } catch(e) { best = 0; }
                updateBestUI(); 
            }
            function saveBest() { try { localStorage.setItem('bb_best', best); } catch(e) {} }
            function loadCoins() { 
                try { coins = parseInt(localStorage.getItem('bb_coins')) || 0; } catch(e) { coins = 0; }
                updateCoinsUI(); 
            }
            function saveCoins() { try { localStorage.setItem('bb_coins', coins); } catch(e) {} }
            function updateBestUI() { if(bestGameSpan) bestGameSpan.innerText = best; if(bestMenuSpan) bestMenuSpan.innerText = best; }
            function updateCoinsUI() { if(coinsGameSpan) coinsGameSpan.innerText = coins; if(coinsMenuSpan) coinsMenuSpan.innerText = coins; }
            function checkBest() { if(score > best) { best = score; saveBest(); updateBestUI(); return true; } return false; }
            function awardCoins() { 
                let earned = Math.floor(score / 1000); 
                if(earned > 0) { 
                    coins += earned; 
                    saveCoins(); 
                    updateCoinsUI(); 
                } 
                return earned; 
            }
            
            function canPlace(figure, r, c) {
                for(let b of figure.blocks) {
                    const nr = r + b.row, nc = c + b.col;
                    if(nr<0 || nr>=SIZE || nc<0 || nc>=SIZE || grid[nr][nc]) return false;
                }
                return true;
            }
            function place(figure, r, c) {
                for(let b of figure.blocks) grid[r + b.row][c + b.col] = 1;
            }
            
            function clearLines() {
                let rows = [], cols = [];
                for(let i=0; i<SIZE; i++) if(grid[i].every(v=>v===1)) rows.push(i);
                for(let j=0; j<SIZE; j++) {
                    let full=true;
                    for(let i=0;i<SIZE;i++) if(grid[i][j]===0){full=false;break;}
                    if(full) cols.push(j);
                }
                let cleared=0;
                for(let r of rows) {
                    for(let j=0;j<SIZE;j++) { if(grid[r][j]) cleared++; grid[r][j]=0; }
                }
                for(let c of cols) {
                    for(let i=0;i<SIZE;i++) { if(grid[i][c]) cleared++; grid[i][c]=0; }
                }
                if(cleared) {
                    let add = cleared * 15 + (rows.length + cols.length) * 40;
                    score += add;
                    updateScore(); checkBest();
                    awardCoins();
                    return true;
                }
                return false;
            }
            
            function hasMoves() {
                for(let f of shapes) {
                    const box = getBoundingBox(f.blocks);
                    for(let i=0; i<=SIZE-box.rows; i++) {
                        for(let j=0; j<=SIZE-box.cols; j++) {
                            if(canPlace(f,i,j)) return true;
                        }
                    }
                }
                return false;
            }
            
            function tryPlace(figure, r, c, idx) {
                if(canPlace(figure, r, c)) {
                    place(figure, r, c);
                    shapes.splice(idx,1);
                    selectedIdx=-1;
                    clearLines();
                    drawBoard();
                    drawPieces();
                    saveGame();
                    if(!shapes.length) {
                        setTimeout(()=>{
                            shapes = bag.get3();
                            drawPieces();
                            drawBoard();
                            saveGame();
                        }, 100);
                    }
                    if(!hasMoves() && shapes.length) {
                        setTimeout(()=>{
                            alert(`💀 GAME OVER! 💀\nСчёт: ${score}`);
                            resetFull();
                            showGame();
                        }, 100);
                    }
                    return true;
                }
                return false;
            }
            
            function getTopLeftFromTouch(figure, touchCellX, touchCellY, offsetX, offsetY) {
                const box = getBoundingBox(figure.blocks);
                let topRow = Math.round(touchCellY - offsetY - box.rows / 2);
                let leftCol = Math.round(touchCellX - offsetX - box.cols / 2);
                topRow = Math.max(0, Math.min(SIZE - box.rows, topRow));
                leftCol = Math.max(0, Math.min(SIZE - box.cols, leftCol));
                return { r: topRow, c: leftCol };
            }
            
            function drawShapeOnCanvas(figure, can, sz=75) {
                can.width=sz; can.height=sz;
                const box = getBoundingBox(figure.blocks);
                const blockW = sz / Math.max(box.rows, box.cols);
                const offX = (sz - blockW * box.cols)/2 - box.minC * blockW;
                const offY = (sz - blockW * box.rows)/2 - box.minR * blockW;
                const t=can.getContext('2d');
                t.clearRect(0,0,sz,sz);
                for(let b of figure.blocks) {
                    const x = offX + b.col * blockW, y = offY + b.row * blockW;
                    const grad = t.createLinearGradient(x,y,x+blockW,y+blockW);
                    grad.addColorStop(0, figure.color);
                    grad.addColorStop(1, '#3a3a5a');
                    t.fillStyle = grad;
                    t.fillRect(x, y, blockW-2, blockW-2);
                    t.fillStyle = 'rgba(255,255,255,0.35)';
                    t.fillRect(x+2, y+2, blockW-8, 3);
                }
            }
            
            function drawBoard() {
                if(!ctx) return;
                const w=canvas.width, h=canvas.height, cw=w/SIZE, ch=h/SIZE;
                ctx.clearRect(0,0,w,h);
                for(let i=0;i<SIZE;i++) {
                    for(let j=0;j<SIZE;j++) {
                        const x=j*cw, y=i*ch;
                        if(grid[i][j]) {
                            const grad=ctx.createLinearGradient(x,y,x+cw,y+ch);
                            grad.addColorStop(0,'#6fc8ff'); grad.addColorStop(1,'#3c9fcf');
                            ctx.fillStyle=grad;
                            ctx.fillRect(x,y,cw-1.5,ch-1.5);
                            ctx.fillStyle='#b1e2ff';
                            ctx.fillRect(x+3,y+3,cw-7,ch-7);
                        } else {
                            ctx.fillStyle='#1b2e39';
                            ctx.fillRect(x,y,cw-1,ch-1);
                            ctx.strokeStyle='#2f5568';
                            ctx.lineWidth=0.8;
                            ctx.strokeRect(x+1,y+1,cw-3,ch-3);
                        }
                    }
                }
                if(selectedIdx!==-1 && !dragActive && shapes[selectedIdx]) {
                    ctx.globalAlpha=0.12;
                    ctx.fillStyle='#ffe29a';
                    ctx.fillRect(0,0,w,h);
                    ctx.globalAlpha=1;
                }
            }
            
            function drawBoardWithPreview(figure, hr, hc) {
                if(!ctx) return;
                const w=canvas.width, h=canvas.height, cw=w/SIZE, ch=h/SIZE;
                ctx.clearRect(0,0,w,h);
                for(let i=0;i<SIZE;i++) {
                    for(let j=0;j<SIZE;j++) {
                        const x=j*cw, y=i*ch;
                        if(grid[i][j]) {
                            const grad=ctx.createLinearGradient(x,y,x+cw,y+ch);
                            grad.addColorStop(0,'#6fc8ff'); grad.addColorStop(1,'#3c9fcf');
                            ctx.fillStyle=grad;
                            ctx.fillRect(x,y,cw-1.5,ch-1.5);
                            ctx.fillStyle='#b1e2ff';
                            ctx.fillRect(x+3,y+3,cw-7,ch-7);
                        } else {
                            ctx.fillStyle='#1b2e39';
                            ctx.fillRect(x,y,cw-1,ch-1);
                            ctx.strokeStyle='#2f5568';
                            ctx.lineWidth=0.8;
                            ctx.strokeRect(x+1,y+1,cw-3,ch-3);
                        }
                    }
                }
                if(figure && hr>=0 && hc>=0) {
                    ctx.globalAlpha=0.65;
                    const can = canPlace(figure, hr, hc);
                    for(let b of figure.blocks) {
                        const x=(hc+b.col)*cw, y=(hr+b.row)*ch;
                        ctx.fillStyle=can?'#90ff90':'#ff9090';
                        ctx.fillRect(x,y,cw-1.5,ch-1.5);
                        ctx.fillStyle='rgba(255,255,255,0.4)';
                        ctx.fillRect(x+3,y+3,cw-7,ch-7);
                    }
                    ctx.globalAlpha=1;
                }
                if(selectedIdx!==-1 && !dragActive && shapes[selectedIdx]) {
                    ctx.globalAlpha=0.12;
                    ctx.fillStyle='#ffe29a';
                    ctx.fillRect(0,0,w,h);
                    ctx.globalAlpha=1;
                }
            }
            
            function drawPieces() {
                if(!piecesDiv) return;
                piecesDiv.innerHTML='';
                shapes.forEach((f,idx)=>{
                    const card = document.createElement('button');
                    card.className = 'piece-card';
                    const mini = document.createElement('canvas');
                    mini.className = 'piece-canvas';
                    drawShapeOnCanvas(f, mini, 75);
                    card.appendChild(mini);
                    
                    card.addEventListener('touchstart', (e)=>{
                        e.preventDefault();
                        const t = e.touches[0];
                        const rect = card.getBoundingClientRect();
                        const cardCenterX = rect.left + rect.width/2;
                        const cardCenterY = rect.top + rect.height/2;
                        dragOffsetX = (t.clientX - cardCenterX) / (rect.width/2) * 0.5;
                        dragOffsetY = (t.clientY - cardCenterY) / (rect.height/2) * 0.5;
                        startDrag(f, idx, t.clientX, t.clientY);
                    });
                    card.addEventListener('mousedown', (e)=>{
                        e.preventDefault();
                        const rect = card.getBoundingClientRect();
                        const cardCenterX = rect.left + rect.width/2;
                        const cardCenterY = rect.top + rect.height/2;
                        dragOffsetX = (e.clientX - cardCenterX) / (rect.width/2) * 0.5;
                        dragOffsetY = (e.clientY - cardCenterY) / (rect.height/2) * 0.5;
                        startDrag(f, idx, e.clientX, e.clientY);
                    });
                    piecesDiv.appendChild(card);
                });
            }
            
            function startDrag(figure, idx, x, y) {
                dragActive=true;
                selectedIdx=idx;
                dragFigure={
                    blocks: figure.blocks.map(b=>({row:b.row,col:b.col})),
                    color: figure.color,
                    name: figure.name
                };
                dragPreview=document.createElement('div');
                dragPreview.className='drag-preview';
                const pc=document.createElement('canvas');
                drawShapeOnCanvas(dragFigure, pc, 85);
                dragPreview.appendChild(pc);
                document.body.appendChild(dragPreview);
                dragPreview.style.left=x+'px';
                dragPreview.style.top=y+'px';
                drawPieces();
                window.addEventListener('touchmove', onMove);
                window.addEventListener('touchend', onEnd);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
            }
            
            function onMove(e) {
                if(!dragActive) return;
                e.preventDefault();
                let x,y;
                if(e.touches) {
                    x=e.touches[0].clientX;
                    y=e.touches[0].clientY;
                } else {
                    x=e.clientX;
                    y=e.clientY;
                }
                if(dragPreview) {
                    dragPreview.style.left=x+'px';
                    dragPreview.style.top=y+'px';
                }
                const rect=canvas.getBoundingClientRect();
                if(x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom) {
                    const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
                    const cx=(x-rect.left)*sx, cy=(y-rect.top)*sy;
                    const cw=canvas.width/SIZE, ch=canvas.height/SIZE;
                    const touchCellX = cx / cw;
                    const touchCellY = cy / ch;
                    const { r, c: colPos } = getTopLeftFromTouch(dragFigure, touchCellX, touchCellY, dragOffsetX, dragOffsetY);
                    hoverR = r;
                    hoverC = colPos;
                    drawBoardWithPreview(dragFigure, hoverR, hoverC);
                    return;
                }
                hoverR = -1;
                hoverC = -1;
                drawBoard();
            }
            
            function onEnd(e) {
                if(!dragActive) return;
                dragActive=false;
                if(dragPreview) {
                    dragPreview.remove();
                    dragPreview=null;
                }
                if(hoverR>=0 && hoverC>=0 && dragFigure && canPlace(dragFigure, hoverR, hoverC)) {
                    tryPlace(dragFigure, hoverR, hoverC, selectedIdx);
                }
                dragFigure=null;
                hoverR=-1;
                hoverC=-1;
                selectedIdx=-1;
                drawBoard();
                drawPieces();
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onEnd);
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onEnd);
            }
            
            function onCanvasTap(e) {
                if(dragActive) return;
                const rect=canvas.getBoundingClientRect();
                const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
                let x,y;
                if(e.touches) {
                    x=e.touches[0].clientX;
                    y=e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    x=e.clientX;
                    y=e.clientY;
                }
                let cx=(x-rect.left)*sx, cy=(y-rect.top)*sy;
                if(cx<0) cx=0; if(cy<0) cy=0;
                const cw=canvas.width/SIZE, ch=canvas.height/SIZE;
                const touchCellX = cx / cw;
                const touchCellY = cy / ch;
                if(selectedIdx!==-1 && shapes[selectedIdx]) {
                    const f=shapes[selectedIdx];
                    const { r, c: colPos } = getTopLeftFromTouch(f, touchCellX, touchCellY, 0, 0);
                    if(canPlace(f, r, colPos)) {
                        tryPlace(f, r, colPos, selectedIdx);
                        drawBoard();
                        drawPieces();
                    }
                }
            }
            
            function updateScore() { if(scoreSpan) scoreSpan.innerText=score; }
            
            function resetFull() {
                grid=Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
                score=0;
                bag=new FigureBag();
                shapes=bag.get3();
                selectedIdx=-1;
                dragActive=false;
                updateScore();
                drawBoard();
                drawPieces();
                checkBest();
                saveGame();
            }
            
            function showGame() {
                if(!loadGame()) resetFull();
                menuUI.style.display='none';
                gameUI.style.display='block';
                updateBestUI();
                updateCoinsUI();
            }
            function showMenu() {
                menuUI.style.display='flex';
                gameUI.style.display='none';
                updateBestUI();
                updateCoinsUI();
            }
            
            function showSettings() {
                const ov=document.createElement('div');
                ov.className='modal-overlay';
                ov.innerHTML = `
                    <div class="modal-card">
                        <div class="modal-title">⚙️ НАСТРОЙКИ</div>
                        <button class="modal-btn" id="newGameBtnSettings">🔄 НАЧАТЬ ЗАНОВО</button>
                        <button class="modal-btn modal-btn-danger" id="menuFromSettings">🏠 ГЛАВНОЕ МЕНЮ</button>
                        <button class="modal-btn modal-close" id="closeSettings">✖️ ЗАКРЫТЬ</button>
                    </div>
                `;
                document.body.appendChild(ov);
                
                document.getElementById('newGameBtnSettings').onclick = () => {
                    if(confirm('Начать новую игру? Весь прогресс будет потерян!')) {
                        resetFull();
                        showGame();
                    }
                    ov.remove();
                };
                document.getElementById('menuFromSettings').onclick = () => {
                    saveGame();
                    ov.remove();
                    showMenu();
                };
                document.getElementById('closeSettings').onclick = () => ov.remove();
                ov.onclick = (e) => { if(e.target === ov) ov.remove(); };
            }
            
            // ИНИЦИАЛИЗАЦИЯ
            window.onload = () => {
                canvas = document.getElementById('gridCanvas');
                ctx = canvas.getContext('2d');
                scoreSpan = document.getElementById('scoreValue');
                piecesDiv = document.getElementById('piecesPanel');
                bestGameSpan = document.getElementById('gameBestScore');
                coinsGameSpan = document.getElementById('gameCoins');
                bestMenuSpan = document.getElementById('menuBestScore');
                coinsMenuSpan = document.getElementById('menuCoins');
                gameUI = document.getElementById('gameInterface');
                menuUI = document.getElementById('mainMenu');
                loadingUI = document.getElementById('loadingScreen');
                
                loadBest();
                loadCoins();
                updateBestUI();
                updateCoinsUI();
                bag = new FigureBag();
                
                document.getElementById('playBtn').onclick = () => showGame();
                document.getElementById('settingsBtn').onclick = () => showSettings();
                
                canvas.addEventListener('click', onCanvasTap);
                canvas.addEventListener('touchstart', (e) => {
                    if(!dragActive){
                        e.preventDefault();
                        onCanvasTap(e);
                    }
                });
                
                setTimeout(() => {
                    loadingUI.style.display = 'none';
                    menuUI.style.display = 'flex';
                }, 1000);
            };
        } catch(e) {
            console.error('Game error:', e);
            document.body.innerHTML = '<div style="color:white;text-align:center;margin-top:50px;">Ошибка загрузки игры. Пожалуйста, обновите страницу.</div>';
        }
    })();
</script>
</body>
</html>
