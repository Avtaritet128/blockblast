<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Blast</title>
    <style>
        * {
            user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            font-family: 'Segoe UI', system-ui;
        }
        .game-container {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 16px;
            text-align: center;
        }
        canvas {
            background: #0f0f1a;
            border-radius: 16px;
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            cursor: pointer;
        }
        .pieces-panel {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .piece-card {
            background: #2a2a4a;
            border: none;
            border-radius: 16px;
            padding: 8px;
            cursor: pointer;
        }
        .piece-canvas {
            width: 70px;
            height: 70px;
            display: block;
        }
        .score {
            color: #ffd93d;
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            background: #e15a4f;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        .menu-btn {
            background: #ff9800;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="score">🎯 СЧЁТ: <span id="scoreValue">0</span> &nbsp;&nbsp; 🪙 <span id="coinValue">0</span></div>
    <canvas id="gameCanvas" width="360" height="360" style="width:100%; max-width:400px; height:auto"></canvas>
    <div class="pieces-panel" id="piecesPanel"></div>
    <div>
        <button id="resetBtn">🔄 СБРОС</button>
        <button class="menu-btn" id="menuBtn">🏠 МЕНЮ</button>
    </div>
</div>

<script>
    // ПРОСТАЯ РАБОЧАЯ ВЕРСИЯ
    const SIZE = 8;
    let grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let score = 0;
    let coins = 0;
    let shapes = [];
    let selectedShape = null;
    let selectedIdx = -1;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Фигуры
    const SHAPES_LIST = [
        { matrix: [[1]] },
        { matrix: [[1,1]] },
        { matrix: [[1],[1]] },
        { matrix: [[1,1,1]] },
        { matrix: [[1],[1],[1]] },
        { matrix: [[1,1],[1,1]] },
        { matrix: [[1,1,1,1]] },
        { matrix: [[1,0],[1,1]] },
        { matrix: [[0,1],[1,1]] }
    ];
    
    function randomShape() {
        const idx = Math.floor(Math.random() * SHAPES_LIST.length);
        return { matrix: SHAPES_LIST[idx].matrix.map(row => [...row]) };
    }
    
    function initShapes() {
        shapes = [randomShape(), randomShape(), randomShape()];
        drawPieces();
    }
    
    function canPlace(matrix, row, col) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c] && (row+r>=SIZE || col+c>=SIZE || grid[row+r][col+c])) return false;
            }
        }
        return true;
    }
    
    function placeShape(matrix, row, col) {
        for(let r=0; r<matrix.length; r++) {
            for(let c=0; c<matrix[0].length; c++) {
                if(matrix[r][c]) grid[row+r][col+c] = 1;
            }
        }
    }
    
    function clearLines() {
        let rows = [];
        let cols = [];
        for(let i=0; i<SIZE; i++) {
            let fullRow = true;
            let fullCol = true;
            for(let j=0; j<SIZE; j++) {
                if(grid[i][j] === 0) fullRow = false;
                if(grid[j][i] === 0) fullCol = false;
            }
            if(fullRow) rows.push(i);
            if(fullCol) cols.push(i);
        }
        
        let cleared = 0;
        for(let r of rows) {
            for(let j=0; j<SIZE; j++) {
                if(grid[r][j]) cleared++;
                grid[r][j] = 0;
            }
        }
        for(let c of cols) {
            for(let i=0; i<SIZE; i++) {
                if(grid[i][c]) cleared++;
                grid[i][c] = 0;
            }
        }
        
        if(cleared > 0) {
            score += cleared * 10;
            if(score >= (Math.floor((score-cleared)/1000)+1)*1000) {
                coins++;
                document.getElementById('coinValue').innerText = coins;
                localStorage.setItem('blockblast_coins', coins);
            }
            document.getElementById('scoreValue').innerText = score;
            drawBoard();
            return true;
        }
        return false;
    }
    
    function tryPlace(matrix, row, col, idx) {
        if(canPlace(matrix, row, col)) {
            placeShape(matrix, row, col);
            shapes.splice(idx,1);
            selectedIdx = -1;
            selectedShape = null;
            clearLines();
            if(shapes.length === 0) initShapes();
            drawBoard();
            drawPieces();
            return true;
        }
        return false;
    }
    
    function drawBoard() {
        const cellW = canvas.width / SIZE;
        const cellH = canvas.height / SIZE;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let i=0; i<SIZE; i++) {
            for(let j=0; j<SIZE; j++) {
                const x = j*cellW;
                const y = i*cellH;
                if(grid[i][j]) {
                    ctx.fillStyle = '#6fc8ff';
                    ctx.fillRect(x,y,cellW-1,cellH-1);
                    ctx.fillStyle = '#b1e2ff';
                    ctx.fillRect(x+3,y+3,cellW-7,cellH-7);
                } else {
                    ctx.fillStyle = '#1b2e39';
                    ctx.fillRect(x,y,cellW-1,cellH-1);
                    ctx.strokeStyle = '#2f5568';
                    ctx.strokeRect(x+1,y+1,cellW-3,cellH-3);
                }
            }
        }
    }
    
    function drawShapeOnCanvas(shape, canvasElem, size=70) {
        canvasElem.width = size;
        canvasElem.height = size;
        const matrix = shape.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;
        const cellW = size / Math.max(rows, cols);
        const offX = (size - cols*cellW)/2;
        const offY = (size - rows*cellW)/2;
        const t = canvasElem.getContext('2d');
        t.clearRect(0,0,size,size);
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                if(matrix[r][c]) {
                    const x = offX + c*cellW;
                    const y = offY + r*cellW;
                    t.fillStyle = '#FFB347';
                    t.fillRect(x,y,cellW-2,cellW-2);
                    t.fillStyle = '#FF9933';
                    t.fillRect(x+2,y+2,cellW-6,cellW-6);
                }
            }
        }
    }
    
    function drawPieces() {
        const panel = document.getElementById('piecesPanel');
        panel.innerHTML = '';
        shapes.forEach((shape, idx) => {
            const card = document.createElement('button');
            card.className = 'piece-card';
            const miniCanvas = document.createElement('canvas');
            miniCanvas.className = 'piece-canvas';
            drawShapeOnCanvas(shape, miniCanvas, 70);
            card.appendChild(miniCanvas);
            card.onclick = () => {
                selectedShape = shape;
                selectedIdx = idx;
                drawBoard();
            };
            panel.appendChild(card);
        });
    }
    
    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if(e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        let canvasX = (clientX - rect.left) * scaleX;
        let canvasY = (clientY - rect.top) * scaleY;
        const cellW = canvas.width / SIZE;
        const cellH = canvas.height / SIZE;
        const col = Math.floor(canvasX / cellW);
        const row = Math.floor(canvasY / cellH);
        if(selectedShape && canPlace(selectedShape.matrix, row, col)) {
            tryPlace(selectedShape.matrix, row, col, selectedIdx);
            drawBoard();
            drawPieces();
        }
    }
    
    function resetGame() {
        grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
        score = 0;
        document.getElementById('scoreValue').innerText = '0';
        initShapes();
        drawBoard();
    }
    
    function loadCoins() {
        const saved = localStorage.getItem('blockblast_coins');
        if(saved) coins = parseInt(saved);
        else coins = 0;
        document.getElementById('coinValue').innerText = coins;
    }
    
    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasClick(e); });
    document.getElementById('resetBtn').onclick = () => resetGame();
    document.getElementById('menuBtn').onclick = () => location.reload();
    
    loadCoins();
    resetGame();
</script>
</body>
</html>
